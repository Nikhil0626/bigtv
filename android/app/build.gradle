    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.multidex:multidex:2.0.1'


    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.google.ads.mediation:facebook:6.18.0.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.facebook.android:audience-network-sdk:6.+'

    implementation 'com.facebook.android:facebook-core:16.0.0'
    implementation 'com.facebook.android:facebook-login:16.0.0'
    implementation 'com.facebook.android:facebook-share:16.0.0'
    implementation 'com.facebook.android:facebook-applinks:16.0.0'
    implementation 'com.facebook.android:facebook-android-sdk:16.1.0'
    implementation 'com.facebook.android:audience-network-sdk:6.17.0'
